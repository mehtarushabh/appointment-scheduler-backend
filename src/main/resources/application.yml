spring:
  application:
    name: appointment-scheduler-backend

  # Local dev/test datasource. These credentials are placeholders (research.md #13) —
  # update username/password to match your local PostgreSQL installation.
  datasource:
    url: jdbc:postgresql://localhost:5432/appointment_scheduler
    username: appointment_app_user
    password: 69649343

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  mail:
    host: localhost
    port: 1025

server:
  port: 8080

appointment-scheduler:
  security:
    # Placeholder local dev signing secret for bearer tokens (T018 TokenService).
    # Do not use this value outside local dev/test.
    token-secret: local-dev-only-secret-change-me
    token-expiry-minutes: 480
